name: Check and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the reading site
        run: python scripts/build.py
      - name: Verify original content, routes and assets
        run: python scripts/check.py
      - name: Verify basic Aura geometry and independent selections
        run: |
          python scripts/check_basic_aura.py
          node scripts/check_basic_aura.mjs
          node --check assets/basic-aura.js
          node --check assets/matrix-studio/basic-viewer.js
      - name: Check optional JavaScript
        run: node --check assets/site.js
      - name: Export public files
        run: python scripts/export.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
